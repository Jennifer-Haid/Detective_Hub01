<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дело № 001: Убийство в театре</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0b1324;
            color: #e2e8f0;
            padding: 30px;
            display: flex;
            justify-content: center;
        }

        .case-container {
            width: 100%;
            max-width: 800px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.2);
        }

        h1 {
            color: #38bdf8;
            font-size: 22px;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        p {
            color: #94a3b8;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .btn-neon {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid #38bdf8;
            color: #38bdf8;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .btn-neon:hover {
            background: #38bdf8;
            color: #0f172a;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
        }
    </style>
</head>
<body>

    <div class="case-container">
        <h1>🔍 Дело № 001: Убийство в театре</h1>
        <p>Расследуйте загадочное убийство главного режиссёра Виктора Громова в гримёрке во время антракта. Изучите улики и найдите преступника.</p>

        <!-- Кнопка возврата на главный экран -->
        <button class="btn-neon" onclick="goHome()">← На главную</button>
    </div>

    <script>
        // Функция возврата на главный экран
        function goHome() {
            window.location.href = '../index.html';
        }
    </script>
</body>
</html>
