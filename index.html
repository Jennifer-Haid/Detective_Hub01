<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detective_Hub - Платформа расследований</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #111827;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --danger-color: #ef4444;
            --success-color: #22c55e;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #1f2937;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

        header {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo { font-size: 1.5rem; font-weight: bold; color: var(--accent-color); cursor: pointer; }
        .user-nav { display: flex; align-items: center; gap: 1rem; }
        .user-badge { font-size: 0.9rem; color: var(--text-muted); background: rgba(255,255,255,0.05); padding: 0.4rem 0.8rem; border-radius: 6px; border: 1px solid var(--border-color); cursor: pointer; }
        .logout-btn { background: transparent; border: 1px solid var(--danger-color); color: var(--danger-color); padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }

        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; flex: 1; width: 100%; }

        /* Авторизация */
        #auth-screen {
            max-width: 420px; margin: 3rem auto; background: var(--panel-bg);
            border: 1px solid var(--border-color); border-radius: 10px; padding: 2.5rem;
        }
        .auth-tabs { display: flex; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); }
        .auth-tab-btn { flex: 1; padding: 0.75rem; background: none; border: none; color: var(--text-muted); font-size: 1rem; font-weight: 600; cursor: pointer; text-align: center; }
        .auth-tab-btn.active { color: var(--accent-color); border-bottom: 2px solid var(--accent-color); }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem; }
        .form-group input { width: 100%; padding: 0.75rem; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-main); }
        .auth-btn { width: 100%; padding: 0.75rem; background: var(--accent-color); color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }

        /* Поле ввода пароля с кнопкой-обезьянкой */
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .password-wrapper input {
            padding-right: 2.8rem;
        }
        .toggle-password-btn {
            position: absolute;
            right: 0.6rem;
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s ease;
        }
        .toggle-password-btn:active {
            transform: scale(1.15);
        }

        .forgot-link {
            display: inline-block;
            margin-top: 0.5rem;
            font-size: 0.85rem;
            color: var(--accent-color);
            cursor: pointer;
            text-decoration: underline;
        }

        .forgot-link:hover {
            color: var(--accent-hover);
        }

        /* Профиль */
        #profile-screen { display: none; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 2rem; margin-bottom: 2rem; }
        .profile-header { display: flex; align-items: center; gap: 1.5rem; margin-bottom: 1.5rem; }
        .avatar-placeholder { width: 70px; height: 70px; border-radius: 50%; background: var(--accent-color); display: flex; justify-content: center; align-items: center; font-size: 2rem; font-weight: bold; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-top: 1rem; }
        .stat-card { background: var(--bg-color); padding: 1rem; border-radius: 8px; border: 1px solid var(--border-color); }
        .stat-card .val { font-size: 1.5rem; font-weight: bold; color: var(--accent-color); }

        /* Лаунчер */
        #launcher-screen { display: none; }
        .cases-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; margin-top: 1.5rem; }
        .case-card { background-color: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 1.5rem; cursor: pointer; transition: transform 0.2s, border-color 0.2s; }
        .case-card:hover { transform: translateY(-4px); border-color: var(--accent-color); }
        .badge { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; background-color: rgba(59, 130, 246, 0.1); color: var(--accent-color); }

        /* Игровой экран */
        #game-screen { display: none; }
        .game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; background: var(--panel-bg); padding: 1rem 1.5rem; border-radius: 8px; border: 1px solid var(--border-color); }
        .back-btn { background: transparent; border: 1px solid var(--text-muted); color: var(--text-main); padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; }
        .timer-box { font-size: 1.25rem; font-weight: bold; font-family: monospace; background: var(--bg-color); padding: 0.5rem 1rem; border-radius: 4px; border: 1px solid var(--border-color); }
        .game-tabs { display: flex; gap: 1rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem; }
        .tab-btn { background: none; border: none; color: var(--text-muted); font-size: 1rem; font-weight: 600; cursor: pointer; padding: 0.5rem 1rem; border-radius: 4px; }
        .tab-btn.active { color: var(--text-main); background: var(--accent-color); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .docs-grid, .suspects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.5rem; }
        .doc-card, .suspect-card { background: var(--panel-bg); border: 1px solid var(--border-color); padding: 1.25rem; border-radius: 8px; }
        .suspect-card { text-align: center; }
        .attempts-counter { font-size: 0.85rem; color: var(--danger-color); margin: 0.5rem 0; }
        .accuse-btn { background-color: var(--accent-color); color: white; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; width: 100%; font-weight: 600; }
        .accuse-btn:disabled { background-color: var(--border-color); color: var(--text-muted); cursor: not-allowed; }

        /* Модальные окна */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; padding: 1rem; z-index: 1000; }
        .modal-content { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; width: 100%; max-width: 600px; max-height: 85vh; overflow-y: auto; padding: 2rem; position: relative; }
        .close-modal { position: absolute; top: 1rem; right: 1rem; background: none; border: none; color: var(--text-main); font-size: 1.5rem; cursor: pointer; }
        .modal-body { margin-top: 1rem; font-size: 0.95rem; line-height: 1.6; white-space: pre-wrap; }
        .accusal-form select { width: 100%; padding: 0.5rem; margin-bottom: 1rem; background: var(--bg-color); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 4px; }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="app.showLauncher()">Detective_Hub</div>
        <div class="user-nav" id="user-nav" style="display: none;">
            <div class="user-badge" id="user-badge" onclick="app.toggleProfile()">👤 Игрок</div>
            <button class="logout-btn" onclick="app.logout()">Выйти</button>
        </div>
    </header>

    <div class="container">
        <!-- Авторизация -->
        <div id="auth-screen">
            <div class="auth-tabs">
                <button class="auth-tab-btn active" id="tab-login-btn" onclick="app.switchAuthMode('login')">Вход</button>
                <button class="auth-tab-btn" id="tab-register-btn" onclick="app.switchAuthMode('register')">Регистрация</button>
            </div>
            
            <!-- Форма входа -->
            <form id="login-form" onsubmit="app.handleLogin(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="login-email" required placeholder="detective@vailing.com">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <div class="password-wrapper">
                        <input type="password" id="login-password" required placeholder="••••••••">
                        <button type="button" class="toggle-password-btn" onclick="app.togglePasswordVisibility('login-password', this)">🙈</button>
                    </div>
                    <span class="forgot-link" onclick="app.switchAuthMode('reset')">Забыли пароль?</span>
                </div>
                <button type="submit" class="auth-btn">Войти</button>
            </form>

            <!-- Форма регистрации -->
            <form id="register-form" style="display: none;" onsubmit="app.handleRegister(event)">
                <div class="form-group">
                    <label>Имя детектива</label>
                    <input type="text" id="reg-username" required placeholder="Детектив Хайд">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="reg-email" required placeholder="detective@vailing.com">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <div class="password-wrapper">
                        <input type="password" id="reg-password" required placeholder="••••••••">
                        <button type="button" class="toggle-password-btn" onclick="app.togglePasswordVisibility('reg-password', this)">🙈</button>
                    </div>
                </div>
                <button type="submit" class="auth-btn">Создать аккаунт</button>
            </form>

            <!-- Форма сброса пароля -->
            <form id="reset-form" style="display: none;" onsubmit="app.handleResetPassword(event)">
                <h3 style="margin-bottom: 1rem; font-size: 1.1rem; color: var(--accent-color);">Восстановление доступа</h3>
                <div class="form-group">
                    <label>Ваш Email</label>
                    <input type="email" id="reset-email" required placeholder="detective@vailing.com">
                </div>
                <div class="form-group">
                    <label>Имя детектива (для подтверждения)</label>
                    <input type="text" id="reset-username" required placeholder="Детектив Хайд">
                </div>
                <div class="form-group">
                    <label>Новый пароль</label>
                    <div class="password-wrapper">
                        <input type="password" id="reset-new-password" required placeholder="••••••••">
                        <button type="button" class="toggle-password-btn" onclick="app.togglePasswordVisibility('reset-new-password', this)">🙈</button>
                    </div>
                </div>
                <button type="submit" class="auth-btn">Сохранить новый пароль</button>
                <div style="text-align: center; margin-top: 1rem;">
                    <span class="forgot-link" onclick="app.switchAuthMode('login')">← Вернуться к входу</span>
                </div>
            </form>
        </div>

        <!-- Профиль -->
        <div id="profile-screen">
            <div class="profile-header">
                <div class="avatar-placeholder" id="profile-avatar">🕵️</div>
                <div><h2 id="profile-name">Имя</h2><p id="profile-email" style="color: var(--text-muted);"></p></div>
            </div>
            <h3>Статистика</h3>
            <div class="stats-grid">
                <div class="stat-card">
                    <div style="font-size: 0.85rem; color: var(--text-muted);">Раскрыто дел</div>
                    <div class="val" id="stat-solved">0</div>
                </div>
            </div>
        </div>

        <!-- Лаунчер (список игр) -->
        <div id="launcher-screen">
            <h1>Доступные сценарии</h1>
            <p>Выберите дело для расследования</p>
            <div class="cases-grid" id="cases-list">
                <!-- Подгружается из папки games -->
            </div>
        </div>

        <!-- Игровой экран -->
        <div id="game-screen">
            <div class="game-header">
                <div>
                    <button class="back-btn" onclick="app.showLauncher()">← Назад в каталог</button>
                    <h2 id="case-title" style="margin-top: 0.5rem;">Название</h2>
                </div>
                <div class="timer-box" id="timer-display">60:00</div>
            </div>

            <div class="game-tabs">
                <button class="tab-btn active" onclick="app.switchTab('docs', this)">Материалы дела</button>
                <button class="tab-btn" onclick="app.switchTab('suspects', this)">Досье подозреваемых</button>
            </div>

            <div id="tab-docs" class="tab-content active"><div class="docs-grid" id="docs-container"></div></div>
            <div id="tab-suspects" class="tab-content"><div class="suspects-grid" id="suspects-container"></div></div>
        </div>
    </div>

    <!-- Модальные окна -->
    <div id="doc-modal" class="modal">
        <div class="modal-content"><button class="close-modal" onclick="app.closeDocModal()">&times;</button><h3 id="modal-doc-title"></h3><div class="modal-body" id="modal-doc-text"></div></div>
    </div>

    <div id="accuse-modal" class="modal">
        <div class="modal-content">
            <button class="close-modal" onclick="app.closeAccuseModal()">&times;</button>
            <h3 id="accuse-title">Обвинение</h3>
            <div class="accusal-form" style="margin-top: 1rem;">
                <label>Улика:</label><select id="accuse-evidence"></select>
                <label>Метод:</label><select id="accuse-method"></select>
                <button class="accuse-btn" onclick="app.submitAccusation()" style="margin-top: 1rem;">Подтвердить</button>
            </div>
        </div>
    </div>

    <script>
        class DetectivePlatform {
            constructor() {
                this.currentUser = null;
                this.currentTimer = null;
                this.timeLeft = 3600;
                this.currentActiveGame = null;
                this.selectedSuspectId = null;
                
                // Каталог доступных игр
                this.availableCases = [
                    { id: "case-404", title: "Последняя репетиция", description: "Убийство режисёра театра «Офелия». Комната заперта изнутри.", path: "games/case-404/script.js" }
                ];
                this.init();
            }

            init() {
                const saved = localStorage.getItem('dh_current_user');
                if (saved) {
                    this.currentUser = JSON.parse(saved);
                    this.showMainApp();
                } else {
                    this.showAuth();
                }
            }

            togglePasswordVisibility(inputId, buttonElement) {
                const input = document.getElementById(inputId);
                if (input.type === 'password') {
                    input.type = 'text';
                    buttonElement.innerText = '🐵';
                } else {
                    input.type = 'password';
                    buttonElement.innerText = '🙈';
                }
            }

            switchAuthMode(m) {
                document.getElementById('login-form').style.display = m === 'login' ? 'block' : 'none';
                document.getElementById('register-form').style.display = m === 'register' ? 'block' : 'none';
                document.getElementById('reset-form').style.display = m === 'reset' ? 'block' : 'none';

                document.getElementById('tab-login-btn').classList.toggle('active', m === 'login');
                document.getElementById('tab-register-btn').classList.toggle('active', m === 'register');
            }

            handleRegister(e) {
                e.preventDefault();
                let username = document.getElementById('reg-username').value.trim();
                let email = document.getElementById('reg-email').value.trim();
                let password = document.getElementById('reg-password').value;

                let users = JSON.parse(localStorage.getItem('dh_users') || '{}');
                if (users[email]) { alert('Пользователь с таким Email уже существует!'); return; }

                let newUser = { username, email, password, solvedCases: 0 };
                users[email] = newUser;
                localStorage.setItem('dh_users', JSON.stringify(users));

                this.currentUser = newUser;
                localStorage.setItem('dh_current_user', JSON.stringify(newUser));
                this.showMainApp();
            }

            handleLogin(e) {
                e.preventDefault();
                let email = document.getElementById('login-email').value.trim();
                let password = document.getElementById('login-password').value;

                let users = JSON.parse(localStorage.getItem('dh_users') || '{}');
                let user = users[email];

                if (user && user.password === password) {
                    this.currentUser = user;
                    localStorage.setItem('dh_current_user', JSON.stringify(user));
                    this.showMainApp();
                } else { 
                    alert('Неверный Email или пароль!'); 
                }
            }

            handleResetPassword(e) {
                e.preventDefault();
                let email = document.getElementById('reset-email').value.trim();
                let username = document.getElementById('reset-username').value.trim();
                let newPassword = document.getElementById('reset-new-password').value;

                let users = JSON.parse(localStorage.getItem('dh_users') || '{}');
                let user = users[email];

                if (!user) {
                    alert('Пользователь с таким Email не найден!');
                    return;
                }

                if (user.username.toLowerCase() !== username.toLowerCase()) {
                    alert('Имя пользователя не совпадает с данным Email!');
                    return;
                }

                // Обновляем пароль пользователя
                user.password = newPassword;
                users[email] = user;
                localStorage.setItem('dh_users', JSON.stringify(users));

                alert('🔑 Пароль успешно изменен! Теперь вы можете войти в аккаунт с новым паролем.');
                this.switchAuthMode('login');
            }

            logout() { 
                localStorage.removeItem('dh_current_user'); 
                location.reload(); 
            }

            showAuth() {
                document.getElementById('auth-screen').style.display = 'block';
                document.getElementById('user-nav').style.display = 'none';
                document.getElementById('launcher-screen').style.display = 'none';
                document.getElementById('game-screen').style.display = 'none';
            }

            showMainApp() {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('user-nav').style.display = 'flex';
                document.getElementById('user-badge').innerText = `👤 ${this.currentUser.username}`;
                this.renderLauncherCases();
                this.showLauncher();
            }

            toggleProfile() {
                let p = document.getElementById('profile-screen');
                if (p.style.display === 'block') { p.style.display = 'none'; } else {
                    document.getElementById('profile-name').innerText = this.currentUser.username;
                    document.getElementById('profile-email').innerText = this.currentUser.email;
                    document.getElementById('stat-solved').innerText = this.currentUser.solvedCases || 0;
                    document.getElementById('profile-avatar').innerText = this.currentUser.username[0].toUpperCase();
                    p.style.display = 'block';
                }
            }

            renderLauncherCases() {
                let list = document.getElementById('cases-list');
                list.innerHTML = '';
                this.availableCases.forEach(c => {
                    list.innerHTML += `
                        <div class="case-card" onclick="app.loadGame('${c.path}')">
                            <span class="badge">Дело ${c.id.replace('case-', '№ ')}</span>
                            <h3 style="margin: 0.5rem 0;">${c.title}</h3>
                            <p style="font-size: 0.85rem; color: var(--text-muted);">${c.description}</p>
                        </div>
                    `;
                });
            }

            showLauncher() {
                clearInterval(this.currentTimer);
                document.getElementById('game-screen').style.display = 'none';
                document.getElementById('profile-screen').style.display = 'none';
                document.getElementById('launcher-screen').style.display = 'block';
            }

            loadGame(scriptPath) {
                let script = document.createElement('script');
                script.src = scriptPath;
                script.onload = () => {
                    this.currentActiveGame = window.loadedCaseData; 
                    document.getElementById('launcher-screen').style.display = 'none';
                    document.getElementById('game-screen').style.display = 'block';
                    document.getElementById('case-title').innerText = this.currentActiveGame.title;
                    this.renderDocs();
                    this.renderSuspects();
                    this.startTimer();
                };
                script.onerror = () => { alert("Не удалось загрузить файлы игры из папки games!"); };
                document.body.appendChild(script);
            }

            startTimer() {
                this.timeLeft = this.currentActiveGame.timer;
                let display = document.getElementById('timer-display');
                clearInterval(this.currentTimer);
                this.currentTimer = setInterval(() => {
                    let m = Math.floor(this.timeLeft / 60), s = this.timeLeft % 60;
                    display.innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                    if (this.timeLeft > 0) this.timeLeft--;
                    else { clearInterval(this.currentTimer); alert("Время вышло!"); }
                }, 1000);
            }

            switchTab(name, btn) {
                document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
                document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
                document.getElementById(`tab-${name}`).classList.add('active');
                btn.classList.add('active');
            }

            renderDocs() {
                let c = document.getElementById('docs-container'); c.innerHTML = '';
                this.currentActiveGame.documents.forEach((doc, i) => {
                    c.innerHTML += `<div class="doc-card" onclick="app.openDoc(${i})"><h4>📄 ${doc.title}</h4></div>`;
                });
            }

            openDoc(i) {
                let doc = this.currentActiveGame.documents[i];
                document.getElementById('modal-doc-title').innerText = doc.title;
                document.getElementById('modal-doc-text').innerText = doc.text;
                document.getElementById('doc-modal').style.display = 'flex';
            }

            closeDocModal() { document.getElementById('doc-modal').style.display = 'none'; }

            renderSuspects() {
                let c = document.getElementById('suspects-container'); c.innerHTML = '';
                this.currentActiveGame.suspects.forEach(s => {
                    let dis = s.attempts <= 0 ? 'disabled' : '';
                    c.innerHTML += `
                        <div class="suspect-card">
                            <h4>${s.name}</h4><p style="font-size:0.85rem; color:var(--text-muted);">${s.role}</p>
                            <div class="attempts-counter">Попыток: ${s.attempts}</div>
                            <button class="accuse-btn" ${dis} onclick="app.openAccuseModal('${s.id}')">${s.attempts > 0 ? 'Обвинить' : 'Закрыто'}</button>
                        </div>
                    `;
                });
            }

            openAccuseModal(id) {
                this.selectedSuspectId = id;
                let s = this.currentActiveGame.suspects.find(x => x.id === id);
                document.getElementById('accuse-title').innerText = `Обвинение: ${s.name}`;
                let ev = document.getElementById('accuse-evidence'); ev.innerHTML = '';
                this.currentActiveGame.evidenceOptions.forEach(o => ev.innerHTML += `<option value="${o}">${o}</option>`);
                let met = document.getElementById('accuse-method'); met.innerHTML = '';
                this.currentActiveGame.methodOptions.forEach(o => met.innerHTML += `<option value="${o}">${o}</option>`);
                document.getElementById('accuse-modal').style.display = 'flex';
            }

            closeAccuseModal() { document.getElementById('accuse-modal').style.display = 'none'; }

            submitAccusation() {
                let s = this.currentActiveGame.suspects.find(x => x.id === this.selectedSuspectId);
                let chosenEv = document.getElementById('accuse-evidence').value;
                let chosenMet = document.getElementById('accuse-method').value;
                this.closeAccuseModal();

                if (this.selectedSuspectId === this.currentActiveGame.solution.suspect && 
                    chosenEv === this.currentActiveGame.solution.evidence && 
                    chosenMet === this.currentActiveGame.solution.method) {
                    
                    clearInterval(this.currentTimer);
                    
                    this.currentUser.solvedCases = (this.currentUser.solvedCases || 0) + 1;
                    localStorage.setItem('dh_current_user', JSON.stringify(this.currentUser));

                    let users = JSON.parse(localStorage.getItem('dh_users') || '{}');
                    if (users[this.currentUser.email]) {
                        users[this.currentUser.email].solvedCases = this.currentUser.solvedCases;
                        localStorage.setItem('dh_users', JSON.stringify(users));
                    }

                    alert(`🎉 Победа! Дело №404 успешно раскрыто (${s.name}). Прогресс сохранен в вашем профиле!`);
                    this.showLauncher();
                } else {
                    s.attempts--;
                    alert(s.attempts > 0 ? "❌ Ошибка! У вас осталась 1 попытка." : "❌ Попытки исчерпаны.");
                    this.renderSuspects();
                }
            }
        }
        const app = new DetectivePlatform();
    </script>
</body>
</html>
