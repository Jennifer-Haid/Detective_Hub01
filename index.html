<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detective_Hub — Создание аккаунта</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        darkMode: 'class',
        theme: {
            extend: {
                colors: {
                    noir: {
                        950: '#080a0f',
                        900: '#0f131d',
                        800: '#171d2b',
                        700: '#232b3e',
                        600: '#323d54',
                        accent: '#3b82f6',
                        gold: '#d97706',
                        goldLight: '#f59e0b',
                        danger: '#dc2626',
                        success: '#16a34a'
                    }
                },
                fontFamily: {
                    mono: ['Courier New', 'Consolas', 'monospace']
                }
            }
        }
    }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #080a0f; }
        ::-webkit-scrollbar-thumb { background: #232b3e; border-radius: 3px; }

        /* Стиль фона для страницы авторизации */
        .auth-bg {
            background: linear-gradient(rgba(5, 10, 20, 0.75), rgba(5, 10, 20, 0.85)), 
                        url('bg-office.jpg') center/cover no-repeat fixed;
        }

        /* Голографический терминал */
        .holo-card {
            background: rgba(10, 20, 35, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(59, 130, 246, 0.4);
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.25), inset 0 0 15px rgba(59, 130, 246, 0.1);
        }

        .holo-input {
            background: rgba(5, 10, 20, 0.85);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #38bdf8;
            outline: none;
            transition: all 0.3s ease;
        }

        .holo-input::placeholder {
            color: #64748b;
        }

        .holo-input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        .holo-btn {
            background: transparent;
            border: 1px solid #38bdf8;
            color: #38bdf8;
            transition: all 0.3s ease;
        }

        .holo-btn:hover {
            background: rgba(56, 189, 248, 0.2);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
            color: #ffffff;
        }

        .badge-glow {
            filter: drop-shadow(0 0 10px rgba(217, 119, 6, 0.35));
        }
    </style>
</head>
<body class="bg-noir-950 text-gray-200 font-sans min-h-screen flex flex-col justify-between selection:bg-amber-600 selection:text-white">

    <!-- ЭКРАН РЕГИСТРАЦИИ И ВХОДА -->
    <div id="auth-screen" class="fixed inset-0 z-50 flex items-center justify-center p-4 auth-bg font-mono">
        <div class="w-full max-w-md space-y-6 text-center">
            
            <!-- Логотип -->
            <div class="space-y-1">
                <div class="flex items-center justify-center space-x-2 text-2xl font-bold tracking-wider text-white drop-shadow-[0_0_12px_rgba(59,130,246,0.8)]">
                    <i class="fa-solid fa-magnifying-glass text-amber-500"></i>
                    <span>DETECTIVE_HUB</span>
                </div>
                <p class="text-xs text-blue-400 tracking-widest uppercase">Полицейский департамент Вэйлинга</p>
            </div>

            <!-- Голографическая карточка -->
            <div class="holo-card rounded-lg p-6 space-y-5 text-left relative">
                
                <h2 id="auth-title" class="text-sm font-bold text-blue-300 tracking-widest text-center uppercase border-b border-blue-500/30 pb-3">
                    CREATE YOUR ACCOUNT
                </h2>

                <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-3">
                    <div class="space-y-1">
                        <input id="input-username" type="text" required placeholder="ИМЯ ДЕТЕКТИВА (USERNAME)" class="holo-input w-full px-3 py-2.5 rounded text-xs tracking-wider">
                    </div>
                    
                    <div id="email-field" class="space-y-1">
                        <input id="input-email" type="email" placeholder="ЭЛЕКТРОННАЯ ПОЧТА (EMAIL)" class="holo-input w-full px-3 py-2.5 rounded text-xs tracking-wider">
                    </div>

                    <div class="space-y-1">
                        <input id="input-password" type="password" required placeholder="ПАРОЛЬ (PASSWORD)" class="holo-input w-full px-3 py-2.5 rounded text-xs tracking-wider">
                    </div>

                    <div id="confirm-field" class="space-y-1">
                        <input id="input-confirm" type="password" placeholder="ПОДТВЕРДИТЬ ПАРОЛЬ (CONFIRM)" class="holo-input w-full px-3 py-2.5 rounded text-xs tracking-wider">
                    </div>

                    <button type="submit" id="auth-submit-btn" class="holo-btn w-full py-2.5 rounded text-xs font-bold tracking-widest uppercase mt-4">
                        [ СОЗДАТЬ АККАУНТ ]
                    </button>
                </form>

                <div class="text-center pt-2">
                    <button type="button" onclick="toggleAuthMode()" id="auth-switch-btn" class="text-[11px] text-gray-400 hover:text-blue-400 tracking-wider transition-colors">
                        [ УЖЕ ЕСТЬ АККАУНТ? ВОЙТИ ]
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ОСНОВНОЙ ИНТЕРФЕЙС КПК (скрыт до авторизации) -->
    <div id="app-screen" class="hidden min-h-screen flex flex-col justify-between">
        <!-- TOP HEADER -->
        <header class="bg-noir-900 border-b border-noir-700 sticky top-0 z-40 shadow-xl">
            <div class="max-w-xl mx-auto p-4 space-y-3">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <div class="relative w-11 h-11 flex-shrink-0 badge-glow">
                            <svg viewBox="0 0 200 200" class="w-full h-full text-amber-500">
                                <polygon points="100,10 125,70 190,70 140,110 160,175 100,135 40,175 60,110 10,70 75,70" fill="#171d2b" stroke="#d97706" stroke-width="8"/>
                                <circle cx="100" cy="100" r="42" fill="#0f131d" stroke="#3b82f6" stroke-width="4"/>
                                <path d="M100,72 L105,87 L120,87 L108,96 L112,111 L100,101 L88,111 L92,96 L80,87 L95,87 Z" fill="#d97706"/>
                            </svg>
                        </div>
                        <div>
                            <h1 class="text-[11px] tracking-widest font-mono text-amber-500 font-bold uppercase">ПОЛИЦЕЙСКИЙ ДЕПАРТАМЕНТ ВЭЙЛИНГА</h1>
                            <h2 class="text-sm font-black tracking-wider text-white uppercase">КПК ДЕТЕКТИВА // ДЕЛО #404</h2>
                        </div>
                    </div>

                    <!-- Информация об аккаунте -->
                    <div class="text-right font-mono">
                        <div id="display-detective-name" class="text-xs font-bold text-blue-400">Детектив</div>
                        <button onclick="logout()" class="text-[10px] text-gray-500 hover:text-red-400">Выйти</button>
                    </div>
                </div>
            </div>
        </header>

        <main class="flex-grow max-w-xl w-full mx-auto p-4">
            <div class="bg-noir-900 border border-noir-700 rounded-xl p-6 text-center space-y-3">
                <i class="fa-solid fa-folder-open text-3xl text-amber-500"></i>
                <h3 class="text-base font-bold text-white">Добро пожаловать в систему, <span id="welcome-name" class="text-blue-400"></span>!</h3>
                <p class="text-xs text-gray-400">Вы успешно вошли в терминал. Выберите дело для начала расследования.</p>
            </div>
        </main>
    </div>

    <!-- Скрипт переключения авторизации -->
    <script>
        let isRegister = true;

        function toggleAuthMode() {
            isRegister = !isRegister;
            const title = document.getElementById('auth-title');
            const submitBtn = document.getElementById('auth-submit-btn');
            const switchBtn = document.getElementById('auth-switch-btn');
            const emailField = document.getElementById('email-field');
            const confirmField = document.getElementById('confirm-field');

            if (isRegister) {
                title.textContent = 'CREATE YOUR ACCOUNT';
                submitBtn
