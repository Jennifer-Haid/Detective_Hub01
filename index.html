<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detective_Hub</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: url('bg.jpg') center/cover no-repeat fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e2e8f0;
            padding: 20px;
        }

        .hologram-card {
            background: rgba(11, 19, 36, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.4);
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.25), inset 0 0 15px rgba(56, 189, 248, 0.15);
            border-radius: 8px;
            padding: 24px;
            width: 100%;
            max-width: 440px;
        }

        .dashboard {
            width: 100%;
            max-width: 950px;
            background: rgba(11, 19, 36, 0.88);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(56, 189, 248, 0.4);
            box-shadow: 0 0 35px rgba(56, 189, 248, 0.2);
            border-radius: 12px;
            padding: 25px;
        }

        .logo-title {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #38bdf8;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
        }

        .hologram-title {
            text-align: center;
            font-size: 14px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #94a3b8;
            margin-bottom: 15px;
        }

        .avatar-selection {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .avatar-option {
            width: 65px;
            height: 65px;
            border-radius: 6px;
            border: 2px solid rgba(56, 189, 248, 0.3);
            cursor: pointer;
            object-fit: cover;
            transition: all 0.3s ease;
            opacity: 0.6;
        }

        .avatar-option.selected {
            border-color: #38bdf8;
            box-shadow: 0 0 12px #38bdf8;
            opacity: 1;
            transform: scale(1.05);
        }

        .form-group {
            margin-bottom: 12px;
            position: relative;
        }

        .input-field {
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 4px;
            padding: 10px 12px;
            color: #f8fafc;
            font-size: 13px;
            outline: none;
            transition: all 0.3s;
        }

        .input-field:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
        }

        .password-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            user-select: none;
        }

        .btn-neon {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid #38bdf8;
            color: #38bdf8;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .btn-neon:hover {
            background: #38bdf8;
            color: #0f172a;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
        }

        .toggle-link {
            text-align: center;
            margin-top: 12px;
            font-size: 12px;
            color: #94a3b8;
            cursor: pointer;
            text-transform: uppercase;
        }

        .toggle-link:hover {
            color: #38bdf8;
            text-decoration: underline;
        }

        .hidden { display: none !important; }

        .user-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(56, 189, 248, 0.3);
            padding-bottom: 15px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 8px;
            transition: background 0.3s;
        }

        .user-profile:hover {
            background: rgba(56, 189, 248, 0.1);
        }

        .user-avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 2px solid #38bdf8;
            object-fit: cover;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        .section-title {
            font-size: 16px;
            letter-spacing: 1.5px;
            color: #38bdf8;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cases-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .case-folder {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 8px;
            padding: 18px;
            position: relative;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .case-folder::before {
            content: '📁 ДЕЛО';
            font-size: 10px;
            font-weight: bold;
            color: #38bdf8;
            letter-spacing: 1px;
            background: rgba(56, 189, 248, 0.15);
            padding: 2px 6px;
            border-radius: 3px;
            position: absolute;
            top: 12px;
            right: 12px;
        }

        .case-folder:hover {
            border-color: #38bdf8;
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.25);
        }

        .case-name {
            font-size: 16px;
            color: #f8fafc;
            margin: 10px 0 6px 0;
            font-weight: bold;
        }

        .case-desc {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .case-status {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 4px;
            width: fit-content;
            margin-bottom: 12px;
        }

        .status-new { background: rgba(56, 189, 248, 0.2); color: #38bdf8; }
        .status-completed { background: rgba(34, 197, 94, 0.2); color: #22c55e; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .profile-modal {
            background: rgba(11, 19, 36, 0.95);
            border: 1px solid #38bdf8;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
            border-radius: 10px;
            padding: 25px;
            width: 90%;
            max-width: 450px;
        }

        .stat-box {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 12px;
            border-radius: 6px;
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <!-- ОКНО АВТОРИЗАЦИИ -->
    <div id="authContainer" class="hologram-card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; border-bottom: 1px solid rgba(56, 189, 248, 0.3); padding-bottom:8px;">
            <div class="logo-title">🔍 DETECTIVE_HUB</div>
        </div>

        <form id="registerForm">
            <div class="hologram-title">CREATE YOUR ACCOUNT</div>
            
            <div class="avatar-selection">
                <img src="images/male.jpg" alt="Мужчина" class="avatar-option selected" id="avatarMale" onclick="selectAvatar('images/male.jpg', this)">
                <img src="images/female.jpg" alt="Женщина" class="avatar-option" id="avatarFemale" onclick="selectAvatar('images/female.jpg', this)">
            </div>

            <div class="form-group">
                <input type="text" id="regUsername" class="input-field" placeholder="ИМЯ ДЕТЕКТИВА (USERNAME)" required>
            </div>
            <div class="form-group">
                <input type="email" id="regEmail" class="input-field" placeholder="ЭЛЕКТРОННАЯ ПОЧТА (НЕОБЯЗАТЕЛЬНО)">
            </div>
            <div class="form-group">
                <input type="password" id="regPassword" class="input-field" placeholder="ПАРОЛЬ (PASSWORD)" required>
                <span class="password-toggle" onclick="togglePass('regPassword', this)">🙈</span>
            </div>
            <div class="form-group">
                <input type="password" id="regConfirm" class="input-field" placeholder="ПОДТВЕРДИТЬ ПАРОЛЬ (CONFIRM)" required>
                <span class="password-toggle" onclick="togglePass('regConfirm', this)">🙈</span>
            </div>

            <button type="submit" class="btn-neon" style="width: 100%;">[ СОЗДАТЬ АККАУНТ ]</button>
            <div class="toggle-link" onclick="switchAuthMode('login')">[ УЖЕ ЕСТЬ АККАУНТ? ВОЙТИ ]</div>
        </form>

        <form id="loginForm" class="hidden">
            <div class="hologram-title">SYSTEM LOGIN</div>
            <div class="form-group">
                <input type="text" id="loginUsername" class="input-field" placeholder="ИМЯ ДЕТЕКТИВА (USERNAME)" required>
            </div>
            <div class="form-group">
                <input type="password" id="loginPassword" class="input-field" placeholder="ПАРОЛЬ (PASSWORD)" required>
                <span class="password-toggle" onclick="togglePass('loginPassword', this)">🙈</span>
            </div>

            <button type="submit" class="btn-neon" style="width: 100%;">[ ВОЙТИ В СИСТЕМУ ]</button>
            <div class="toggle-link" onclick="switchAuthMode('register')">[ НЕТ АККАУНТА? ЗАРЕГИСТРИРОВАТЬСЯ ]</div>
        </form>
    </div>

    <!-- ГЛАВНЫЙ ЭКРАН -->
    <div id="mainDashboard" class="dashboard hidden">
        <div class="user-header">
            <div class="user-profile" onclick="openProfileModal()">
                <img id="userAvatarDisplay" class="user-avatar" src="images/male.jpg" alt="Аватар">
                <div>
                    <h2 id="userNameDisplay" style="color: #38bdf8; font-size: 18px;">Детектив</h2>
                    <span style="font-size: 12px; color: #94a3b8;">⚙️ Нажать для просмотра дела</span>
                </div>
            </div>
            <button class="btn-neon" style="border-color: #ef4444; color: #ef4444;" onclick="logout()">Выйти</button>
        </div>

        <div class="section-title">📂 АКТИВНЫЕ ДЕЛА И РАССЛЕДОВАНИЯ</div>
        <div class="cases-grid" id="casesGridContainer"></div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ПРОФИЛЯ -->
    <div id="profileModal" class="modal-overlay hidden">
        <div class="profile-modal">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="color: #38bdf8;">📋 ЛИЧНОЕ ДЕЛО ДЕТЕКТИВА</h3>
                <span style="cursor: pointer; color: #94a3b8; font-weight: bold;" onclick="closeProfileModal()">✕</span>
            </div>

            <div style="text-align: center; margin-bottom: 15px;">
                <img id="modalAvatarDisplay" src="images/male.jpg" style="width: 80px; height: 80px; border-radius: 50%; border: 2px solid #38bdf8; object-fit: cover; margin-bottom: 10px;">
                <br>
                <label class="btn-neon" style="font-size: 11px; padding: 4px 10px; cursor: pointer;">
                    📷 Изменить фото из галереи
                    <input type="file" id="customAvatarInput" accept="image/*" class="hidden" onchange="uploadCustomAvatar(event)">
                </label>
            </div>

            <div class="stat-box">
                <span style="color: #94a3b8; font-size: 13px;">Имя детектива:</span>
                <strong id="modalUsername" style="color: #f8fafc;">---</strong>
            </div>

            <div class="stat-box">
                <span style="color: #94a3b8; font-size: 13px;">Пройдено дел:</span>
                <strong id="completedCount" style="color: #22c55e;">0 / 2</strong>
            </div>

            <div class="stat-box">
                <span style="color: #94a3b8; font-size: 13px;">Текущий статус:</span>
                <strong id="detectiveRank" style="color: #38bdf8;">Стажёр</strong>
            </div>

            <button class="btn-neon" style="width: 100%; margin-top: 15px;" onclick="closeProfileModal()">ЗАКРЫТЬ</button>
        </div>
    </div>

    <!-- Подключаем Firebase SDK через модули -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBIKUtpys1SdNIXabhtOxrOJnwkiOv4Y_8",
            authDomain: "detective-hub.firebaseapp.com",
            projectId: "detective-hub",
            storageBucket: "detective-hub.appspot.com",
            messagingSenderId: "641986528678",
            appId: "1:641986528678:web:13de9ac469b73efe363b67",
            measurementId: "G-REH1BG06M1",
            databaseURL: "https://detective-hub-default-rtdb.europe-west1.firebasedatabase.app"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const casesData = [
            {
                id: 'case-001',
                title: 'Дело № 001: Убийство в театре',
                description: 'Расследуйте загадочное убийство главного режиссёра Виктора Громова в гримёрке во время антракта.',
                fileUrl: 'games/case-001.html'
            },
            {
                id: 'case-002',
                title: 'Дело № 002: В разработке',
                description: 'Обновление скоро! Следите за новыми обновлениями в нашем тгк Detective_Hub.',
                fileUrl: 'games/case-002.html'
            }
        ];

        let selectedAvatarUrl = 'images/male.jpg';

        window.selectAvatar = function(url, element) {
            selectedAvatarUrl = url;
            document.querySelectorAll('.avatar-option').forEach(img => img.classList.remove('selected'));
            element.classList.add('selected');
        }

        window.togglePass = function(inputId, toggleBtn) {
            const field = document.getElementById(inputId);
            if (field.type === 'password') {
                field.type = 'text';
                toggleBtn.textContent = '🐵';
            } else {
                field.type = 'password';
                toggleBtn.textContent = '🙈';
            }
        }

        window.switchAuthMode = function(mode) {
            if (mode === 'login') {
                document.getElementById('registerForm').classList.add('hidden');
                document.getElementById('loginForm').classList.remove('hidden');
            } else {
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('registerForm').classList.remove('hidden');
            }
        }

        // РЕГИСТРАЦИЯ В ОБЛАКЕ
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('regUsername').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const pass = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regConfirm').value;

            if (pass !== confirm) {
                alert('Пароли не совпадают!');
                return;
            }

            const userRef = ref(db, 'users/' + username);
            const snapshot = await get(userRef);

            if (snapshot.exists()) {
                alert('Детектив с таким именем уже зарегистрирован в системе!');
                return;
            }

            const newUser = {
                username: username,
                email: email || '',
                password: pass,
                avatar: selectedAvatarUrl,
                completedCases: []
            };

            await set(userRef, newUser);
            localStorage.setItem('active_detective_session', username);
            loadSession();
        });

        // ВХОД ИЗ ОБЛАКА
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value.trim();
            const pass = document.getElementById('loginPassword').value;

            const userRef = ref(db, 'users/' + username);
            const snapshot = await get(userRef);

            if (!snapshot.exists()) {
                alert('Пользователь не найден в облачной базе!');
                return;
            }

            const userData = snapshot.val();
            if (userData.password !== pass) {
                alert('Неверный пароль!');
                return;
            }

            localStorage.setItem('active_detective_session', username);
            loadSession();
        });

        async function loadSession() {
            const activeUsername = localStorage.getItem('active_detective_session');
            if (activeUsername) {
                const userRef = ref(db, 'users/' + activeUsername);
                const snapshot = await get(userRef);

                if (snapshot.exists()) {
                    const user = snapshot.val();
                    document.getElementById('authContainer').classList.add('hidden');
                    document.getElementById('mainDashboard').classList.remove('hidden');
                    
                    document.getElementById('userNameDisplay').textContent = user.username;
                    document.getElementById('userAvatarDisplay').src = user.avatar;
                    
                    renderCases(user);
                    return;
                }
            }
            document.getElementById('authContainer').classList.remove('hidden');
            document.getElementById('mainDashboard').classList.add('hidden');
        }

        function renderCases(user) {
            const container = document.getElementById('casesGridContainer');
            container.innerHTML = '';

            casesData.forEach(item => {
                const isCompleted = user.completedCases && user.completedCases.includes(item.id);

                const card = document.createElement('div');
                card.className = 'case-folder';
                card.innerHTML = `
                    <div>
                        <div class="case-status ${isCompleted ? 'status-completed' : 'status-new'}">
                            ${isCompleted ? '✓ ПРОЙДЕНО' : '● ДОСТУПНО'}
                        </div>
                        <div class="case-name">${item.title}</div>
                        <div class="case-desc">${item.description}</div>
                    </div>
                    <button class="btn-neon" style="width: 100%;" onclick="openCase('${item.fileUrl}')">
                        ${isCompleted ? 'ПЕРЕПРОЙТИ' : 'ОТКРЫТЬ ДЕЛО'}
                    </button>
                `;
                container.appendChild(card);
            });
        }

        window.openCase = function(fileUrl) {
            window.location.href = fileUrl;
        }

        window.openProfileModal = async function() {
            const activeUsername = localStorage.getItem('active_detective_session');
            if (!activeUsername) return;

            const snapshot = await get(ref(db, 'users/' + activeUsername));
            if (!snapshot.exists()) return;
            const user = snapshot.val();

            document.getElementById('modalUsername').textContent = user.username;
            document.getElementById('modalAvatarDisplay').src = user.avatar;

            const completed = user.completedCases ? user.completedCases.length : 0;
            document.getElementById('completedCount').textContent = `${completed} / ${casesData.length}`;

            if (completed === 0) document.getElementById('detectiveRank').textContent = 'Стажёр';
            else if (completed < casesData.length) document.getElementById('detectiveRank').textContent = 'Детектив';
            else document.getElementById('detectiveRank').textContent = 'Шеф Детективного Бюро';

            document.getElementById('profileModal').classList.remove('hidden');
        }

        window.closeProfileModal = function() {
            document.getElementById('profileModal').classList.add('hidden');
        }

        window.uploadCustomAvatar = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                const base64Avatar = e.target.result;

                document.getElementById('modalAvatarDisplay').src = base64Avatar;
                document.getElementById('userAvatarDisplay').src = base64Avatar;

                const activeUsername = localStorage.getItem('active_detective_session');
                await update(ref(db, 'users/' + activeUsername), { avatar: base64Avatar });
            };
            reader.readAsDataURL(file);
        }

        window.logout = function() {
            localStorage.removeItem('active_detective_session');
            loadSession();
        }

        loadSession();
    </script>
</body>
</html>
